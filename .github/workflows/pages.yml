name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/iphone-app-dev-btdy4g]
    paths: [SmartScheduleExpo/web/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: SmartScheduleExpo/web
          force_orphan: true
